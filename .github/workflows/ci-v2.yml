name: CI (v2)

on:
  push:
    branches: [main]
    paths: ["v2/**", "web/**", ".github/workflows/ci-v2.yml"]
  pull_request:
    paths: ["v2/**", "web/**", ".github/workflows/ci-v2.yml"]
  workflow_dispatch:

concurrency:
  group: ci-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (Node)
    runs-on: ubuntu-latest
    container: node:24-trixie-slim
    defaults:
      run:
        working-directory: v2/api
    steps:
      - name: Native toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends g++ git pkg-config libsqlite3-dev librocksdb-dev ca-certificates

      - uses: actions/checkout@v4

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build FFI shim
        env:
          CELER_MEM_GIT_REF: v3.1.0
        run: ./native/build.sh

      - name: Test
        run: npm test

  image:
    name: Image builds
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: v2/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
