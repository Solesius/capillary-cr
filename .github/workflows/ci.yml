name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (Node)
    runs-on: ubuntu-latest
    container: node:24-trixie-slim
    defaults:
      run:
        working-directory: api
    steps:
      - name: Native toolchain
        # Runs before checkout, so the job's api/ working directory does not exist yet.
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends g++ git pkg-config libsqlite3-dev librocksdb-dev ca-certificates

      - uses: actions/checkout@v4

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build FFI shim
        env:
          CELER_MEM_GIT_REF: v3.1.0
        run: ./native/build.sh

      - name: Test
        run: npm test

  image:
    name: Image builds
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    name: Web (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run -s build
